workflows:
  cinevault-android-workflow:
    name: CineVault Android & TV Workflow
    max_build_duration: 60
    environment:
      java: 21
      vars:
        TMDB_API_KEY: "001604f130b812c3b1663ee0986b968d"
    scripts:
      - name: Create local.properties and .env configuration
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "TMDB_API_KEY=$TMDB_API_KEY" > .env
      - name: Build Release APK and App Bundle (AAB) using Gradle
        script: |
          # Agar gradlew file nahi hai toh direct gradle command use karein
          gradle clean assembleRelease bundleRelease
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - rajeev990@gmail.com
        notify:
          success: true
          failure: true
          
